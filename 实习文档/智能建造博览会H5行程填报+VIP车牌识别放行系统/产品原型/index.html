<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能建造博览会 · 业务原型</title>
<style>
:root {
  --ink: #17212b;
  --muted: #667085;
  --line: #e4e7ec;
  --canvas: #f4f6f8;
  --surface: #ffffff;
  --blue: #246bfd;
  --blue-weak: #eef4ff;
  --neutral-700: #374151;
  --neutral-400: #9ca3af;
  --neutral-200: #e5e7eb;
  --neutral-100: #f3f4f6;
  --neutral-50: #f9fafb;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink); background: var(--canvas); font-size: 14px; letter-spacing: 0;
}
button, input, textarea, select { font: inherit; letter-spacing: 0; }
button { cursor: pointer; }
.app { min-height: 100vh; display: grid; grid-template-rows: 64px 1fr; }
.topbar {
  height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 24px;
  background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 310px; }
.brand-mark {
  width: 34px; height: 34px; display: grid; place-items: center; color: white;
  background: #173f5f; border-radius: 7px; font-weight: 800; font-size: 13px;
}
.brand strong { display: block; font-size: 15px; }
.brand small { display: block; color: var(--muted); margin-top: 2px; font-size: 11px; }
.review-status { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 7px; }
.status-dot { width: 7px; height: 7px; background: var(--blue); border-radius: 50%; }
.icon-btn, .plain-btn {
  min-height: 34px; border: 1px solid var(--line); background: white; color: #344054;
  border-radius: 6px; padding: 0 11px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.icon-btn { width: 36px; padding: 0; font-size: 17px; }
.icon-btn:hover, .plain-btn:hover { border-color: #98a2b3; background: #f9fafb; }
.body-grid { display: grid; grid-template-columns: 224px minmax(520px, 1fr) 286px; min-height: calc(100vh - 64px); }
.sidebar, .inspector { background: var(--surface); }
.sidebar { border-right: 1px solid var(--line); padding: 20px 14px; }
.side-label { color: #98a2b3; font-weight: 700; font-size: 11px; margin: 0 8px 9px; text-transform: uppercase; }
.flow-nav { display: grid; gap: 5px; }
.flow-nav button {
  display: grid; grid-template-columns: 34px 1fr 20px; align-items: center; width: 100%;
  text-align: left; border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 9px 8px; color: #344054;
}
.flow-nav button:hover { background: #f7f8fa; }
.flow-nav button.active { background: var(--blue-weak); color: #1849a9; border-color: #d1e0ff; }
.nav-icon { width: 28px; height: 28px; display: grid; place-items: center; background: #f2f4f7; border-radius: 6px; font-weight: 800; }
.flow-nav button.active .nav-icon { background: white; color: var(--blue); }
.nav-copy strong { display: block; font-size: 13px; }
.nav-copy small { display: block; font-size: 10px; color: #98a2b3; margin-top: 2px; }
.arrow { color: #98a2b3; font-size: 16px; }
.side-divider { height: 1px; background: var(--line); margin: 20px 8px; }
.source-btn { width: 100%; justify-content: flex-start; padding-left: 12px; }
.source-note { padding: 14px 8px; color: var(--muted); font-size: 11px; line-height: 1.65; }
.workspace { min-width: 0; padding: 22px; }
.workspace-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
.workspace-title h1 { font-size: 18px; margin: 0 0 5px; }
.workspace-title p { margin: 0; color: var(--muted); font-size: 12px; }
.viewport-toggle { display: flex; border: 1px solid var(--line); border-radius: 6px; background: white; overflow: hidden; }
.viewport-toggle button { width: 36px; height: 32px; border: 0; border-right: 1px solid var(--line); background: white; color: #667085; }
.viewport-toggle button:last-child { border-right: 0; }
.viewport-toggle button.active { background: #f2f4f7; color: var(--ink); font-weight: 700; }
.stage {
  min-height: calc(100vh - 144px); padding: 28px; display: flex; align-items: flex-start; justify-content: center;
  background-color: #e9edf1; background-image: radial-gradient(#cdd4dc 0.7px, transparent 0.7px);
  background-size: 16px 16px; border: 1px solid #dde2e8; border-radius: 8px; overflow: auto;
}
.phone-shell {
  width: 390px; min-width: 390px; height: 844px; background: #111820; border: 8px solid #111820;
  border-radius: 34px; box-shadow: 0 18px 45px rgba(16,24,40,.18); overflow: hidden;
}
.phone-screen { width: 100%; height: 100%; background: white; border-radius: 25px; overflow: hidden; display: grid; grid-template-rows: 27px 52px 1fr; }
.phone-status { padding: 7px 17px 0; display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; }
.phone-status span:last-child { letter-spacing: 1px; }
.mobile-head { border-bottom: 1px solid #edf0f2; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 0 10px; }
.mobile-head strong { text-align: center; font-size: 16px; }
.mobile-head button { border: 0; background: transparent; font-size: 23px; color: #344054; height: 40px; }
.mobile-page { overflow-y: auto; background: #f7f8fa; }

/* ── tripSearch 主入口布局（在 phone 外框内）── */
.trip-main {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.trip-form {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.trip-form .form-sections {
  padding: 8px 14px 16px;
}

.trip-header {
  background: white;
}

/* 顶部搜索条 */
.search-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: white;
  border-bottom: 1px solid var(--line);
}
.search-strip input {
  flex: 1;
  padding: 9px 12px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  font-size: 14px;
  color: var(--ink);
  background: #f7f8fa;
  outline: none;
}
.search-strip input:focus {
  border-color: var(--blue);
  background: white;
}
.search-strip input.highlight {
  border-color: var(--blue);
  background: #eff6ff;
  box-shadow: 0 0 0 3px rgba(37,99,235,.15);
  animation: highlightPulse 1.5s ease-out;
}
@keyframes highlightPulse {
  0%   { box-shadow: 0 0 0 3px rgba(37,99,235,.25); }
  100% { box-shadow: 0 0 0 3px rgba(37,99,235,.0); }
}
.search-go-btn {
  padding: 9px 16px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.page-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--blue-weak);
  border-bottom: 1px solid var(--blue);
  gap: 8px;
}

/* 顶部嘉宾信息条 */

/* 底部微信输入栏 */
.bottom-bar {
  flex-shrink: 0;
  background: white;
  border-top: 1px solid var(--line);
  padding: 8px 12px;
  position: sticky;
  bottom: 0;
  z-index: 10;
  box-shadow: 0 -2px 12px rgba(0,0,0,.06);
}

/* 搜索结果（紧跟搜索条下方） */
.search-results {
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-top: 6px;
  background: white;
  overflow: hidden;
  max-height: 260px;
  overflow-y: auto;
}
.sr-empty {
  padding: 12px 14px;
  font-size: 13px;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.sr-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--line);
  transition: background .1s;
}
.sr-row:last-child { border-bottom: none; }
.sr-row:hover { background: var(--blue-weak); }
.sr-row .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #e8eaed;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  flex-shrink: 0;
}
.sr-row span:nth-child(2) { flex: 1; min-width: 0; }
.sr-row strong { font-size: 14px; color: var(--ink); display: block; }
.sr-row small { font-size: 11px; color: var(--muted); display: block; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-new-row { background: var(--blue-weak); }

/* 微信输入栏 */
.wx-composer {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
}

.mobile-page::-webkit-scrollbar { width: 0; }
.hero-strip { background: #173f5f; color: white; padding: 22px 20px 25px; }
.hero-strip .eyebrow { color: #b9d7e9; font-size: 11px; margin-bottom: 8px; }
.hero-strip h2 { font-size: 22px; margin: 0 0 8px; }
.hero-strip p { color: #d7e6ee; font-size: 12px; line-height: 1.65; margin: 0; }
.mobile-content { padding: 16px; }

/* 飞书表单风格 */
.fs-section {
  background: white; border-radius: 8px; border: 1px solid var(--line);
  margin-bottom: 12px; padding: 14px 14px 4px;
  overflow: visible;
}
.fs-section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--line);
}
.fs-section-head strong { font-size: 13px; font-weight: 700; }
.fs-section-head small { color: var(--muted); font-size: 10px; }
.fs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fs-grid.single { grid-template-columns: 1fr; }
.fs-field { display: block; }
.fs-field label {
  display: flex; align-items: center; gap: 4px; margin-bottom: 6px;
  color: #344054; font-size: 11px; font-weight: 600;
}
.fs-field input, .fs-field textarea, .fs-field select {
  width: 100%; border: 1px solid #d0d5dd; background: white; color: var(--ink);
  border-radius: 6px; padding: 9px 10px; min-height: 36px; font-size: 12px; outline: none;
}
.fs-field textarea { min-height: 86px; resize: none; line-height: 1.55; }
.fs-field input:focus, .fs-field textarea:focus, .fs-field select:focus {
  border-color: var(--blue); box-shadow: 0 0 0 3px rgba(36,107,253,.1);
}
.fs-field select { position: relative; z-index: 1; }
.fs-tip { color: var(--muted); font-size: 10px; line-height: 1.55; margin-top: 6px; }
.fs-radio, .fs-check {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.fs-radio span, .fs-check span {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border: 1px solid #d0d5dd; border-radius: 4px;
  font-size: 11px; color: #344054; background: white;
}
.fs-radio span.on, .fs-check span.on {
  background: var(--blue-weak); border-color: #b2ccff; color: #1849a9;
}
.fs-actions {
  display: flex; gap: 10px; padding: 14px 16px;
  background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
  position: sticky; bottom: 0;
}
.fs-actions .primary { flex: 2; }
.fs-actions .secondary { flex: 1; }

/* 必填校验：提交时高亮空字段 */
.fs-field.error input,
.fs-field.error select,
.fs-field.error textarea {
  border-color: #ef4444 !important;
  background: #fff5f5;
}
.fs-field.error label {
  color: #ef4444;
}

/* 折叠分区（嘉宾/接待/行程 三栏） */
.fs-section.collapsible .fs-section-head {
  cursor: pointer; user-select: none;
  border-bottom: 1px dashed var(--line);
}
.fs-section.collapsible .fs-section-head:hover strong { color: var(--blue); }
.fs-section.collapsible .fs-section-head::after {
  content: '▾'; font-size: 14px; color: var(--muted);
  transition: transform .25s ease;
  margin-left: 6px;
}
.fs-section.collapsible.collapsed .fs-section-head::after {
  content: '▸';
}
.fs-section.collapsible .fs-section-body {
  overflow: hidden;
  max-height: 4000px;
  transition: max-height .3s ease, opacity .25s ease, margin .25s ease, padding .25s ease;
  opacity: 1;
}
.fs-section.collapsible.collapsed .fs-section-body {
  max-height: 0; opacity: 0; margin: 0; padding: 0;
  pointer-events: none;
}
/* 三栏纵向布局：所有 fs-grid 强制单列（不论之前是不是 .single） */
.fs-form-stack .fs-grid {
  grid-template-columns: 1fr;
}
.login-content { padding: 27px 20px; background: white; min-height: 100%; }
.login-title h2 { font-size: 21px; margin: 0 0 8px; }
.login-title p { margin: 0 0 25px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.field { margin-bottom: 15px; }
.field label { display: flex; align-items: center; gap: 5px; margin-bottom: 7px; color: #344054; font-size: 12px; font-weight: 650; }
.required { color: var(--blue); }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid #d0d5dd; background: white; color: var(--ink); border-radius: 6px;
  padding: 10px 11px; min-height: 42px; outline: none;
}
.field textarea { min-height: 108px; resize: none; line-height: 1.6; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(36,107,253,.1); }
.input-combo { display: flex; }
.input-combo input { border-radius: 6px 0 0 6px; }
.input-combo button { min-width: 105px; border: 1px solid #d0d5dd; border-left: 0; border-radius: 0 6px 6px 0; background: #f9fafb; color: var(--blue); }
.primary, .secondary, .danger-btn, .success-btn {
  border: 0; min-height: 44px; padding: 0 16px; border-radius: 6px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
.primary { color: white; background: var(--blue); }
.primary:hover { background: #175cd3; }
.secondary { color: #344054; background: white; border: 1px solid #d0d5dd; }
.danger-btn { color: white; background: var(--ink); }
.success-btn { color: white; background: var(--blue); }
.block { width: 100%; }
.button-row { display: flex; gap: 10px; }
.button-row > * { flex: 1; }
.helper { color: var(--muted); font-size: 11px; line-height: 1.55; }
.notice { border: 1px solid var(--line); background: var(--neutral-50); color: var(--neutral-700); border-radius: 6px; padding: 11px 12px; font-size: 11px; line-height: 1.55; }
.notice.info { background: var(--blue-weak); border-color: var(--blue); color: var(--ink); }
.notice.success { background: var(--blue-weak); border-color: var(--blue); color: var(--ink); }
.search-box { position: relative; }
.search-box input { padding-left: 35px; }
.search-box::before { content: "⌕"; position: absolute; left: 11px; top: 7px; z-index: 2; font-size: 22px; color: #667085; }
.section-caption { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 9px; }
.section-caption strong { font-size: 12px; }
.section-caption span { color: #98a2b3; font-size: 10px; }
.person-list { border-top: 1px solid var(--line); background: white; }
.person-row { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: white; padding: 13px 16px; display: grid; grid-template-columns: 36px 1fr 20px; gap: 11px; align-items: center; text-align: left; }
.person-row:hover { background: #f9fafb; }
.avatar { width: 36px; height: 36px; background: #e8f3ec; color: #18794e; border-radius: 50%; display: grid; place-items: center; font-weight: 800; }
.person-row strong { display: block; font-size: 13px; }
.person-row small { color: var(--muted); font-size: 10px; display: block; margin-top: 3px; }
.add-person { width: calc(100% - 32px); margin: 14px 16px; }
.entry-card { border-radius: 10px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border: 1px solid var(--line); border-radius: 7px; background: #f2f4f7; margin-bottom: 16px; }
.segmented button { height: 34px; border: 0; background: transparent; color: var(--muted); border-radius: 5px; }
.segmented button.active { background: white; color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(16,24,40,.1); }
.voice-box { background: white; text-align: center; padding: 24px 18px; border: 1px solid var(--line); border-radius: 7px; }
.mic-button { width: 82px; height: 82px; border: 0; border-radius: 50%; background: #eaf2ff; color: var(--blue); font-size: 30px; margin-bottom: 13px; }
.mic-button.recording { background: var(--blue-weak); color: var(--blue); box-shadow: 0 0 0 8px var(--neutral-50); }
.voice-box h3 { margin: 0 0 5px; font-size: 15px; }
.voice-box p { margin: 0; color: var(--muted); font-size: 11px; }
.transcript { margin-top: 14px; padding: 13px; background: #f9fafb; text-align: left; line-height: 1.65; font-size: 12px; border-left: 3px solid var(--blue); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 10px; color: #475467; background: white; border: 1px solid var(--line); padding: 4px 7px; border-radius: 12px; }

/* ===== 微信式底部输入栏 ===== */
.wx-composer {
  position: sticky; bottom: 0; left: 0; right: 0;
  background: #f7f7f7; border-top: 1px solid #e5e5e5;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 8px;
  z-index: 5;
}
.wx-composer .wx-icon-btn {
  width: 34px; height: 34px; flex: 0 0 34px;
  display: inline-flex; align-items: center; justify-content: center;
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  font-size: 16px; color: #555; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.wx-composer .wx-icon-btn:active { background: #efefef; }
.wx-composer .wx-icon-btn.on { background: var(--blue-weak); color: var(--blue); border-color: var(--blue); }

.wx-composer .wx-text-input {
  flex: 1; min-width: 0; height: 34px; padding: 0 12px;
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  font-size: 13px; outline: none; color: var(--ink);
}
.wx-composer .wx-text-input:focus { border-color: var(--blue); }

.wx-composer .wx-hold-mic {
  flex: 1; min-width: 0; height: 34px;
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  font-size: 13px; color: #555; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  -webkit-tap-highlight-color: transparent;
}
.wx-composer .wx-hold-mic:active,
.wx-composer .wx-hold-mic.recording {
  background: var(--blue-weak); color: var(--blue); border-color: var(--blue);
}
.wx-composer .wx-hold-mic.recording { animation: wxPulse 1.2s ease-in-out infinite; }
@keyframes wxPulse { 0%,100%{opacity:1} 50%{opacity:.65} }

.wx-composer .wx-send-btn {
  height: 34px; padding: 0 12px;
  background: var(--blue); color: white; border: 0; border-radius: 6px;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
.wx-composer .wx-send-btn:disabled { opacity: .5; cursor: not-allowed; }
.wx-composer .wx-hold-btn {
  flex: 1; min-width: 0; height: 34px;
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  font-size: 13px; color: #555; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  -webkit-tap-highlight-color: transparent;
}
.wx-composer .wx-hold-btn:active,
.wx-composer .wx-hold-btn.recording {
  background: var(--blue-weak); color: var(--blue); border-color: var(--blue);
}
.wx-composer .wx-hold-btn.recording { animation: wxPulse 1.2s ease-in-out infinite; }
.wx-composer .wx-hold-btn.text-btn { color: var(--blue); border-color: var(--blue); background: var(--blue-weak); }
@keyframes wxPulse { 0%,100%{opacity:1} 50%{opacity:.65} }

/* ===== 嘉宾下拉选择器 ===== */
.guest-dropdown {
  max-height: 0; overflow: hidden;
  transition: max-height .3s ease;
}
.guest-dropdown.open { max-height: 400px; overflow-y: auto; }
.dd-option {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border-bottom: 1px solid #f0f1f3; cursor: pointer;
  transition: background .15s;
}
.dd-option:last-child { border-bottom: 0; }
.dd-option:hover { background: var(--blue-weak); }
.dd-option.selected { background: var(--blue-weak); }
.dd-option .avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: #e5e7eb; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #374151; flex: 0 0 36px;
}
.dd-option small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.dd-option strong { font-size: 13px; color: var(--ink); }

/* ===== 语音转写悬浮面板 ===== */
.transcript-float {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.45); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn .15s ease;
}

function transcriptFloat() {
  var text = state.aiParsedText || '';
  var elapsed = state.recording && state.recordingStart ? Math.floor((Date.now() - state.recordingStart) / 1000) : 0;
  var mm = String(Math.floor(elapsed / 60)).padStart(2,'0');
  var ss = String(elapsed % 60).padStart(2,'0');
  return '<div class="transcript-float" id="transcriptFloat"><div class="tf-top"><span class="tf-dot">●</span><span>实时转写</span><span class="tf-timer">' + mm + ':' + ss + '</span></div><div class="tf-body"><textarea id="tfTextarea" placeholder="识别内容显示在这里，可手动编辑" data-action="tf-textarea">' + esc(text) + '</textarea></div><div class="tf-bottom"><button class="tf-cancel" data-action="tf-cancel">取消</button><button class="tf-confirm" data-action="tf-confirm"' + (text?'':' disabled') + '>确认解析</button></div></div>';
}

// 通用：嘉宾行程确认卡片（行程填报确认页 / 车辆放行 VIP 匹配页 复用）
// fields: [{ label, value }]，opts: { title: '嘉宾信息' | '行程信息' }
function tripReviewCard(fields, opts = {}) {
  const { title = '嘉宾信息', notice = '' } = opts;
  const items = fields
    .filter(f => f.value !== undefined && f.value !== null && f.value !== '')
    .map(f => `<div class="review-item"><span>${esc(f.label)}</span><strong>${f.value}</strong></div>`)
    .join('');
  const noticeHtml = notice
    ? `<div class="notice info" style="margin-bottom:16px;"><strong>${esc(notice.title || '')}</strong>${notice.body || ''}</div>`
    : '';
  return `
  <div style="padding:16px 14px;">
    ${noticeHtml}
    <div class="fs-section">
      <div class="fs-section-head"><strong>${esc(title)}</strong></div>
      ${items}
    </div>
  </div>`;
}

function render() {
  const flow = flows[state.flow];
  document.getElementById('workspaceTitle').textContent = flow.title;
  document.getElementById('workspaceDesc').textContent = flow.desc;
  document.querySelectorAll('[data-flow]').forEach(btn => btn.classList.toggle('active', btn.dataset.flow === state.flow));
  renderScreen();
}

function go(screen, opts = {}) {
  if (opts.replace) {
    // 替换当前屏，不入栈（用于点击 ‹ 后回到旧屏）
    state.screen = screen;
  } else {
    // 入栈：把当前屏入栈，再切到目标屏
    if (state.screen && state.screen !== screen) state.history.push(state.screen);
    state.screen = screen;
  }
  if (screen === 'vehicleCapture' || screen === 'vehicleLogin') state.forcePass = false;
  if (screen === 'adminAccounts') { state.accountAction = 'edit'; state.selectedAccount = '陈敏'; }
  render();
}

// 智能返回上一页面（用栈，栈空则跳到当前 flow 的 initial）
function back() {
  if (state.history.length > 0) {
    const prev = state.history.pop();
    go(prev, { replace: true });
  } else {
    // 栈空（已位于初始屏） → 不动作，提示已在入口
    showToast('已在工作台首页');
  }
}

// 重置当前 flow：清栈并跳到 initial
function resetFlow() {
  state.history = [];
  go(flows[state.flow].initial, { replace: true });
}

const recognitionChunks = [
  '王建国，',
  '王建国，13912345678，',
  '王建国，13912345678，10月8日从上海自驾过来，',
  '王建国，13912345678，10月8日从上海自驾过来，车牌京A8888W，',
  '王建国，13912345678，10月8日从上海自驾过来，车牌京A8888W，下午两点到北京，',
  '王建国，13912345678，10月8日从上海自驾过来，车牌京A8888W，下午两点到北京，需要接站，',
  '王建国，13912345678，10月8日从上海自驾过来，车牌京A8888W，下午两点到北京，需要接站，住国家会议中心大酒店，',
  '王建国，13912345678，10月8日从上海自驾过来，车牌京A8888W，下午两点到北京，需要接站，住国家会议中心大酒店，2晚'
];

function startStreamingRecognition() {
  let chunkIdx = 0;
  // 每 1.5 秒追加一段转写文字，模拟流式识别
  state.recognitionStream = setInterval(() => {
    const ta = document.querySelector('#aiTranscript');
    if (!ta || chunkIdx >= recognitionChunks.length) {
      stopStreamingRecognition();
      // 全部识别完成后自动停止录音
      if (state.recording) {
        state.recording = false;
        render();
      }
      return;
    }
    // 追加并实时同步到 state
    ta.value = recognitionChunks[chunkIdx];
    state.aiParsedText = recognitionChunks[chunkIdx];
    // 自动滚动到底部
    ta.scrollTop = ta.scrollHeight;
    chunkIdx++;
    // 更新计时器
    const elapsed = Math.floor((Date.now() - state.recordingStart) / 1000);
    const mmss = `00:${String(elapsed).padStart(2, '0')}`;
    const timer = document.querySelector('#recTimer');
    if (timer) timer.textContent = mmss;
  }, 1500);
}

function stopStreamingRecognition() {
  if (state.recognitionStream) {
    clearInterval(state.recognitionStream);
    state.recognitionStream = null;
  }
}

function runAiParse(text) {
  const nameMatch = text.match(/([\u4e00-\u9fa5]{2,4})[，,，]|我叫([\u4e00-\u9fa5]{2,4})/);
  state.aiParsedName = nameMatch ? (nameMatch[2] || nameMatch[1]) : '';
  state.aiParsedPhone = text.match(/1[3-9]\d[\s\-]?\d{4}[\s\-]?\d{4}/)?.[0] || '';
  if (text.includes('自驾') || text.includes('开车') || text.includes('自己开车')) {
    state.travelMode = 'drive';
    const plateMatch = text.match(/([\u4e00-\u9fa5][A-Z][A-Z0-9]{4,6})|([A-Z]{2}[A-Z0-9]{5})/);
    state.aiParsedPlate = plateMatch ? plateMatch[0] : ''; state.aiParsedTrain = ''; state.aiParsedFlight = '';
  } else if (text.includes('航班') || text.includes('飞机') || text.includes('飞')) {
    state.travelMode = 'flight';
    const flightMatch = text.match(/([A-Z]{2}[A-Z0-9]{3,4})/);
    state.aiParsedFlight = flightMatch ? flightMatch[0] : 'CA1234'; state.aiParsedTrain = ''; state.aiParsedPlate = '';
  } else {
    state.travelMode = 'train';
    const trainMatch = text.match(/([GDCZKYT]\d{1,4})/);
    state.aiParsedTrain = trainMatch ? trainMatch[0] : 'G12'; state.aiParsedFlight = ''; state.aiParsedPlate = '';
  }
  state.aiParsedCity = text.includes('上海') ? '上海' : (text.includes('广州') ? '广州' : (text.includes('深圳') ? '深圳' : '上海'));
  const dateMatch = text.match(/(\d{1,2})月(\d{1,2})日/);
  state.aiParsedTime = dateMatch ? `${dateMatch[1]}月${dateMatch[2]}日 14:00` : '10月8日 14:00';
  state.aiParsedNights = text.includes('3晚') ? '3晚' : '2晚';
  state.aiParsedHotel = '国家会议中心大酒店';
  state.pickup = (text.includes('接站') || text.includes('需要接')) ? 'yes' : 'no';
  if (state.pickup === 'yes') {
    if (text.includes('大兴')) state.station = '大兴机场';
    else if (text.includes('首都机场') || text.includes('T1') || text.includes('T2') || text.includes('T3')) state.station = '首都机场 T3';
    else if (text.includes('北京南站')) state.station = '北京南站';
    else if (text.includes('北京站')) state.station = '北京站';
    else if (text.includes('北京西站')) state.station = '北京西站';
    else state.station = '北京南站';
  }
  const peopleMatch = text.match(/(\d+)人/);
  state.aiParsedPeople = peopleMatch ? `${peopleMatch[1]}人` : '2人';
  const personMap = {
    '张三':    {title:'董事长',   company:'中建八局'},
    '张珊':    {title:'总经理',   company:'中建三局'},
    '王建国':  {title:'总工程师', company:'中建一局'},
    '李明':    {title:'项目经理', company:'中建二局'}
  };
  const parsedName = state.aiParsedName;
  if (parsedName && personMap[parsedName]) {
    state.aiStatus = 'found';
    state.aiParsedTitle   = personMap[parsedName].title;
    state.aiParsedCompany = personMap[parsedName].company;
    state.confirmedName  = parsedName;
    state.confirmedTitle = personMap[parsedName].title;
    state.confirmedCompany = personMap[parsedName].company;
  } else {
    state.aiStatus = 'not_found';
    state.confirmedName = ''; state.confirmedTitle = ''; state.confirmedCompany = '';
    showToast('未在名单中找到此人，已填入表单可手动调整');
  }
  render();
}

      const sendBtn = document.querySelector('.wx-send-btn');
      if (sendBtn) {
        if ((aiTextInput.value || '').trim().length > 0) sendBtn.removeAttribute('disabled');
        else sendBtn.setAttribute('disabled', '');
      }
    }
    return;
  }

  // 录音 —— 模拟实时语音转写：每隔 1.5 秒追加一段识别文字
  if (e.target.closest('[data-action="record"]')) {
    state.recording = !state.recording;
    if (state.recording) {
      // 开始：保存起始时间，启动模拟转写定时器
      state.recordingStart = Date.now();
      startStreamingRecognition();
    } else {
      // 停止：清除定时器
      stopStreamingRecognition();
    }
    render();
    return;
  }

  // —— 微信输入栏：按住说话（mousedown/touchstart 开始） ——
  if (e.type.startsWith('mouse') || e.type.startsWith('touch')) {
    const holdBtn = e.target.closest('[data-action="hold-record"]');
    if (holdBtn && (e.type === 'mousedown' || e.type === 'touchstart')) {
      if (state.aiInputMode !== 'voice') return;
      e.preventDefault();
      if (state.recording) return;
      state.recording = true;
      state.recordingStart = Date.now();
      startStreamingRecognition();
      render();
      return;
    }
    if (holdBtn && (e.type === 'mouseup' || e.type === 'mouseleave' || e.type === 'touchend' || e.type === 'touchcancel')) {
      if (state.aiInputMode !== 'voice' || !state.recording) return;
      e.preventDefault();
      state.recording = false;
      stopStreamingRecognition();
      render();
      return;
    }
  }

  // AI解析按钮 —— 先同步 textarea 内容到 state，再解析
  // AI解析按钮（底部「解析」）
  if (e.target.closest('[data-action="ai-parse"]') ||
      (e.type === 'keydown' && e.key === 'Enter' && e.target.id === 'aiTranscriptInline')) {
    if (state.recording) {
      state.recording = false;
      stopStreamingRecognition();
    }
    if (e.type === 'keydown') {
      e.preventDefault();
      const inlineTa = document.querySelector('#aiTranscriptInline');
      if (inlineTa) state.aiParsedText = inlineTa.value || '';
    }
    const ta = document.querySelector('#aiTranscript') || document.querySelector('#aiTranscriptInline');
    const text = (ta ? (ta.value || '').trim() : (state.aiParsedText || '')) || '';
    if (!text) { showToast('请先录入信息'); return; }
    state.aiParsedText = text;
    state.aiParsed = true;
    showToast('正在智能解析…');
    setTimeout(() => {
      runAiParse(text);
    }, 800);
    return;
  }

  const pickup = e.target.closest('[data-pickup]'); if (pickup) { state.pickup = pickup.dataset.pickup; render(); return; }
  const travelMode = e.target.closest('.travel-mode-toggle span');
  if (travelMode) { state.travelMode = travelMode.dataset.mode; render(); return; }

  // 表单分区折叠/展开
  const collapseHead = e.target.closest('[data-collapse]');
  if (collapseHead) {
    const key = collapseHead.dataset.collapse;
    state.sectionCollapsed[key] = !state.sectionCollapsed[key];
    render();
    return;
  }
  if (e.target.closest('[data-action="capture"]') || e.target.closest('[data-action="upload"]')) { showToast('正在识别车牌…'); setTimeout(()=>go('vehicleResult'),450); return; }
  if (e.target.closest('[data-action="match"]')) { showToast('正在查询 VIP 白名单…'); setTimeout(()=>go('vehicleDecision'),450); return; }
  if (e.target.closest('[data-action="forcePass"]')) { state.forcePass = true; showToast('强制放行中…'); setTimeout(()=>go('vehiclePassed'),450); return; }

  // 确认并同步 → 确认预览页
  if (e.target.closest('[data-confirm-trip]')) {
    showToast('正在准备确认…');
    setTimeout(() => go('tripConfirm'), 300);
    return;
  }

  // 返回修改
  if (e.target.closest('[data-action="back-to-edit"]')) {
    state.aiParsed = false;
    state.aiStatus = '';
    state.travelMode = 'train';
    back();
    return;
  }

  // 确认提交
  if (e.target.closest('[data-action="submit-confirm"]')) {
    showToast('正在同步在线表格…');
    setTimeout(() => go('tripSuccess'), 450);
    return;
  }

  // 继续填报下一位 → 清栈并回到检索页（不回到 tripLogin）
  if (e.target.closest('[data-action="reset-and-search"]')) {
    state.confirmedName = '';
    state.aiParsed = false;
    state.aiParsedText = '';
    state.aiStatus = '';
    state.entrySource = '';
    state.searchKeyword = '';
    state.recording = false;
    stopStreamingRecognition();
    state.travelMode = 'train';
    state.history = ['tripSearch'];  // 把栈重置为 [tripSearch]，丢弃 success/confirm/input 等
    go('tripSearch', { replace: true });
    return;
  }

  const toast = e.target.closest('[data-toast]'); if (toast) showToast(toast.dataset.toast);

  // 下拉场景切换（演示用）
  if (e.target.id === 'pickupScenario') state.pickup = e.target.value;
  if (e.target.id === 'stationScenario') state.station = e.target.value;
  if (e.target.id === 'travelModeScenario') state.travelMode = e.target.value;
  if (e.target.id === 'aiStatusScenario') {
    state.aiStatus = e.target.value;
    if (e.target.value === 'found') {
      state.aiParsedName = '王建国';
      state.entrySource = 'ai';
    } else if (e.target.value === 'not_found') {
      state.aiParsedName = '王建国';
      state.entrySource = 'ai';
    } else {
      state.entrySource = '';
    }
  }
  if (e.target.id === 'titleScenario') state.aiParsedTitle = e.target.value;
  if (e.target.id === 'ocrScenario') state.ocr = e.target.value;
  if (e.target.id === 'vehicleScenario') state.vehicleType = e.target.value;
  if (e.target.id === 'duplicateScenario') { state.duplicate = e.target.value === 'true'; state.forcePass = false; }
  if (e.target.id === 'accountScenario') state.accountAction = e.target.value;
  render();
}

// 把主委托函数暴露给 document._delegate，
// 让 mousedown/mouseup/touchstart/touchend/input 事件能复用同一套分发逻辑
document._delegate = _delegateHandler;
document.addEventListener('click', _delegateHandler);
document.addEventListener('change', _delegateHandler);

function showToast(message) {
  const t = document.getElementById('toast'); t.textContent = message; t.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(()=>t.classList.remove('show'),1600);
}

document.getElementById('resetAll').addEventListener('click', () => { state.screen = flows[state.flow].initial; state.history = [state.screen]; state.recording = false; render(); showToast('当前流程已重置'); });
const modal = document.getElementById('sourceModal');
document.getElementById('openSource').addEventListener('click', ()=>modal.classList.add('open'));
document.getElementById('openSource2').addEventListener('click', ()=>modal.classList.add('open'));
document.getElementById('closeSource').addEventListener('click', ()=>modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
const sourceMap = {trip:['../流程图/会务人员信息录入业务流程.drawio.png','会务人员信息录入业务流程图'],vehicle:['../流程图/会务人员车辆放行业务流程.drawio.png','会务人员车辆放行业务流程图'],admin:['../流程图/管理员业务流程.drawio.png','管理员业务流程图']};
document.querySelectorAll('[data-source]').forEach(btn => btn.addEventListener('click', () => { document.querySelectorAll('[data-source]').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); const [src,alt]=sourceMap[btn.dataset.source]; document.getElementById('sourceImage').src=src; document.getElementById('sourceImage').alt=alt; }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

// —— 微信输入栏专用事件：mousedown/mouseup 驱动「按住 说话」 ——
['mousedown','mouseup','mouseleave'].forEach(type => {
  document.addEventListener(type, e => {
    const fn = document._delegate; if (fn) fn(e);
  });
});
['touchstart','touchend','touchcancel'].forEach(type => {
  document.addEventListener(type, e => {
    const fn = document._delegate; if (fn) fn(e);
  });
});
document.addEventListener('input', e => {
  const fn = document._delegate; if (fn) fn(e);
});
document.addEventListener('keydown', e => {
  // 仅转发 Enter 给搜索框，其他 keydown 不走主委托
  if (e.key !== 'Enter') return;
  const fn = document._delegate; if (fn) fn(e);
});
// 初始化：把当前 flow 的 initial 推入栈底作为兜底
state.history = [flows[state.flow].initial];
render();
</script>
</body>
</html>
